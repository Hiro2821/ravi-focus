<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tabi Focus — 旅する集中</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<style>
  :root{
    --paper:#EEF1F5;
    --ink:#12151A;
    --ink-soft:#5B6472;
    --ink-faint:#9AA3B2;
    --surface:#FFFFFF;
    --surface-soft:#F7F8FA;
    --line-local:#E8590C;
    --line-shinkansen:#0B3D91;
    --line-flight:#0A84C4;
    --primary:#1B2537;
    --hairline:#E1E5EB;
    --sea:#DCE7F0;
    --land:#ECEEE7;
    --coast:#B7C3CE;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow-card:0 10px 30px rgba(18,21,26,0.07);
    --shadow-float:0 14px 40px rgba(18,21,26,0.18);
    --accent: var(--primary);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    overflow:hidden;
  }
  .num{
    font-family:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.02em;
  }
  #app{position:relative; width:100%; height:100vh; height:100dvh;}
  .screen{
    position:absolute; inset:0;
    opacity:0; pointer-events:none;
    transform:translateY(8px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .screen.active{opacity:1; pointer-events:auto; transform:translateY(0);}

  /* ---------- HOME ---------- */
  #screen-home{overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .home-wrap{max-width:560px; margin:0 auto; padding:28px 20px 60px;}
  .home-header{margin-bottom:22px;}
  .eyebrow{
    font-size:12.5px; font-weight:600; color:var(--ink-faint);
    letter-spacing:.14em; text-transform:uppercase; margin:0 0 6px;
  }
  .home-title{
    font-size:29px; font-weight:800; margin:0 0 6px; letter-spacing:-0.01em;
  }
  .home-sub{font-size:14.5px; color:var(--ink-soft); margin:0; line-height:1.6;}

  .search-card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:18px;
    margin-bottom:16px;
  }
  .field-row{position:relative; display:flex; flex-direction:column;}
  .field{
    display:flex; align-items:center; gap:12px;
    padding:14px 4px;
  }
  .field + .field{border-top:1px solid var(--hairline);}
  .field-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--ink-faint); flex-shrink:0;
  }
  .field.to .field-dot{background:var(--primary); position:relative;}
  .field.to .field-dot::before{
    content:""; position:absolute; left:50%; top:-19px; transform:translateX(-50%);
    width:1px; height:12px; background:var(--hairline);
  }
  .field-labels{display:flex; flex-direction:column; flex:1; min-width:0;}
  .field-labels label{font-size:10.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px;}
  .field-labels input{
    border:none; outline:none; background:none; font-size:16.5px; font-weight:600;
    color:var(--ink); padding:0; font-family:inherit; width:100%;
  }
  .field-labels input::placeholder{color:var(--ink-faint); font-weight:500;}
  .swap-btn{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:36px; height:36px; border-radius:50%; border:1px solid var(--hairline);
    background:var(--surface-soft); display:flex; align-items:center; justify-content:center;
    font-size:15px; color:var(--ink-soft); cursor:pointer;
  }
  .swap-btn:active{background:var(--hairline);}

  .mode-tabs{display:flex; gap:8px; margin:16px 0;}
  .mode-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:12px 6px; border-radius:var(--radius-md); border:1.5px solid var(--hairline);
    background:var(--surface); cursor:pointer; transition:.15s;
  }
  .mode-tab .icon{font-size:19px;}
  .mode-tab .label{font-size:12px; font-weight:700; color:var(--ink-soft);}
  .mode-tab.active{border-color:var(--mode-color); background:color-mix(in srgb, var(--mode-color) 8%, white);}
  .mode-tab.active .label{color:var(--mode-color);}

  .search-btn{
    width:100%; padding:15px; border:none; border-radius:var(--radius-md);
    background:var(--primary); color:#fff; font-size:15.5px; font-weight:700;
    letter-spacing:.02em; cursor:pointer; margin-top:2px;
  }
  .search-btn:active{opacity:.85;}

  .chips{display:flex; gap:8px; flex-wrap:wrap; margin:16px 2px 4px;}
  .chip{
    font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--hairline);
    padding:8px 13px; border-radius:20px; cursor:pointer;
  }
  .chip:active{background:var(--surface-soft);}

  .results-head{
    margin:26px 2px 12px; font-size:12.5px; font-weight:700; color:var(--ink-faint);
    letter-spacing:.1em; text-transform:uppercase;
  }
  .results-list{display:flex; flex-direction:column; gap:12px;}
  .empty-state{
    text-align:center; padding:34px 20px; color:var(--ink-faint); font-size:13.5px; line-height:1.7;
  }

  .route-card{
    display:flex; background:var(--surface); border-radius:var(--radius-md);
    box-shadow:var(--shadow-card); overflow:hidden;
  }
  .route-main{flex:1; padding:16px 14px; min-width:0;}
  .route-line-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    color:#fff; background:var(--mode-color); padding:3px 9px; border-radius:20px; margin-bottom:9px;
  }
  .route-path{font-size:15.5px; font-weight:700; color:var(--ink); margin-bottom:3px;}
  .route-meta{font-size:12.5px; color:var(--ink-soft);}
  .route-stub{
    width:88px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-left:1.5px dashed var(--hairline); padding:10px 6px; gap:8px;
  }
  .route-stub .dur{font-size:16px; font-weight:800; color:var(--ink); text-align:center; line-height:1.2;}
  .route-stub .dur-label{font-size:9.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.06em;}
  .start-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--mode-color);
    color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .start-btn:active{opacity:.8;}

  /* ---------- FOCUS ---------- */
  #screen-focus{background:var(--sea);}
  #map{position:absolute; inset:0; z-index:1; background:var(--sea); overflow:hidden;}
  #map-svg{width:100%; height:100%; display:block; position:absolute; inset:0; opacity:1; transition:opacity .6s ease;}
  #tile-map{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .6s ease; background:var(--sea);}
  #tile-map.tile-live{opacity:1;}
  #map-svg.svg-retired{opacity:0;}
  .city-dot{fill:var(--ink-faint);}
  .city-label{
    font-size:11px; font-weight:700; fill:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    paint-order:stroke; stroke:rgba(255,255,255,.85); stroke-width:3px; stroke-linejoin:round;
  }
  .tile-vehicle-rot{transition:transform .4s linear; transform-origin:center;}
  .maplibregl-ctrl-attrib{font-size:9px !important; background:rgba(255,255,255,.7) !important;}
  .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left{z-index:5;}
  .focus-top{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 0;
  }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px); box-shadow:var(--shadow-card); display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--ink); cursor:pointer;
  }
  .route-pill{
    background:rgba(255,255,255,.92); backdrop-filter:blur(8px); box-shadow:var(--shadow-card);
    border-radius:30px; padding:9px 16px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;
  }
  .route-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--mode-color);}
  .route-pill .badge{
    background:var(--mode-color); color:#fff; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:12px; margin-left:2px;
  }

  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-radius:26px 26px 0 0; box-shadow:var(--shadow-float);
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-handle{width:38px; height:4px; border-radius:3px; background:var(--hairline); margin:0 auto 14px;}
  .progress-track{height:4px; border-radius:3px; background:var(--hairline); overflow:hidden; margin-bottom:6px;}
  .progress-fill{height:100%; background:var(--mode-color); border-radius:3px; width:0%; transition:width .4s linear;}
  .progress-caption{
    display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); font-weight:600; margin-bottom:16px;
  }
  .progress-caption .num{color:var(--ink-soft);}

  .station-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .station-col{display:flex; flex-direction:column; flex:1; min-width:0;}
  .station-col.next{align-items:flex-end; text-align:right;}
  .station-tag{font-size:10.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px;}
  .station-name{font-size:20px; font-weight:800; color:var(--ink); line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .station-arrow{font-size:15px; color:var(--ink-faint); flex-shrink:0; padding:0 10px;}

  .stat-row{display:flex; gap:10px; margin-bottom:6px;}
  .stat-box{
    flex:1; background:var(--surface-soft); border-radius:14px; padding:11px 8px; text-align:center;
  }
  .stat-box .v{font-size:17px; font-weight:800; color:var(--ink);}
  .stat-box .l{font-size:10px; color:var(--ink-faint); font-weight:700; margin-top:3px; letter-spacing:.03em;}

  .eta-line{
    text-align:center; font-size:12px; color:var(--ink-soft); margin-top:12px; padding-top:12px;
    border-top:1px dashed var(--hairline);
  }
  .eta-line .num{font-weight:700; color:var(--ink);}

  /* ---------- ARRIVAL ---------- */
  #screen-arrival{
    background:var(--primary); color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:40px;
  }
  .arrival-emoji{font-size:56px; margin-bottom:18px;}
  .arrival-title{font-size:23px; font-weight:800; margin-bottom:10px;}
  .arrival-station{font-size:16px; font-weight:600; color:rgba(255,255,255,.85); margin-bottom:4px;}
  .arrival-sub{font-size:13.5px; color:rgba(255,255,255,.6); margin-bottom:36px;}
  .arrival-home-btn{
    padding:14px 34px; border-radius:30px; border:1.5px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .arrival-home-btn:active{background:rgba(255,255,255,.18);}

  @media (prefers-reduced-motion: reduce){
    .screen, .progress-fill{transition:none !important;}
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============ HOME ============ -->
  <div id="screen-home" class="screen active">
    <div class="home-wrap">
      <div class="home-header">
        <p class="eyebrow">Tabi Focus</p>
        <h1 class="home-title">どこへ旅しますか？</h1>
        <p class="home-sub">移動時間をそのまま集中時間に。実際の所要時間でタイマーが動きます。</p>
      </div>

      <div class="search-card">
        <div class="field-row">
          <div class="field from">
            <div class="field-dot"></div>
            <div class="field-labels">
              <label id="from-label">出発駅</label>
              <input id="from-input" type="text" placeholder="例：京都" autocomplete="off">
            </div>
          </div>
          <div class="field to">
            <div class="field-dot"></div>
            <div class="field-labels">
              <label id="to-label">到着駅</label>
              <input id="to-input" type="text" placeholder="例：大阪" autocomplete="off">
            </div>
          </div>
          <button class="swap-btn" id="swap-btn" title="入れ替え">⇅</button>
        </div>

        <div class="mode-tabs" id="mode-tabs">
          <div class="mode-tab active" data-mode="train" style="--mode-color:#E8590C">
            <div class="icon">🚃</div><div class="label">在来線</div>
          </div>
          <div class="mode-tab" data-mode="shinkansen" style="--mode-color:#0B3D91">
            <div class="icon">🚄</div><div class="label">新幹線</div>
          </div>
          <div class="mode-tab" data-mode="flight" style="--mode-color:#0A84C4">
            <div class="icon">✈️</div><div class="label">飛行機</div>
          </div>
        </div>

        <button class="search-btn" id="search-btn">検索する</button>
      </div>

      <div class="chips" id="chips"></div>

      <div class="results-head">検索結果</div>
      <div class="results-list" id="results-list">
        <div class="empty-state">出発地と到着地を入力して検索してください。</div>
      </div>
    </div>
  </div>

  <!-- ============ FOCUS ============ -->
  <div id="screen-focus" class="screen">
    <div id="map">
      <div id="tile-map"></div>
      <svg id="map-svg" preserveAspectRatio="xMidYMid meet">
        <rect x="-2000000" y="-2000000" width="4000000" height="4000000" fill="var(--sea)"></rect>
        <g id="land-layer" fill="var(--land)" stroke="var(--coast)"></g>
        <g id="city-layer"></g>
        <path id="route-full-line" fill="none" stroke="#B9C0CC" stroke-linejoin="round" stroke-linecap="round"></path>
        <path id="route-traveled-line" fill="none" stroke-linejoin="round" stroke-linecap="round"></path>
        <g id="station-dots"></g>
        <g id="vehicle-marker">
          <g id="vehicle-content"></g>
        </g>
      </svg>
    </div>
    <div class="focus-top">
      <button class="icon-btn" id="focus-back">✕</button>
      <div class="route-pill" id="route-pill">
        <span class="dot"></span>
        <span id="route-pill-text">— → —</span>
        <span class="badge" id="route-pill-badge">—</span>
      </div>
      <div style="width:40px;"></div>
    </div>

    <div class="sheet" id="sheet-train">
      <div class="sheet-handle"></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill-t"></div></div>
      <div class="progress-caption">
        <span>進捗率</span>
        <span class="num" id="progress-pct-t">0%</span>
      </div>
      <div class="station-row">
        <div class="station-col">
          <span class="station-tag">現在</span>
          <span class="station-name" id="cur-station">—</span>
        </div>
        <span class="station-arrow">→</span>
        <div class="station-col next">
          <span class="station-tag">次</span>
          <span class="station-name" id="next-station">—</span>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-box"><div class="v num" id="remain-count">—</div><div class="l">残り駅数</div></div>
        <div class="stat-box"><div class="v num" id="next-eta">—</div><div class="l">次駅まで</div></div>
        <div class="stat-box"><div class="v num" id="arrive-eta">—</div><div class="l">到着まで</div></div>
      </div>
      <div class="eta-line">到着予定 <span class="num" id="arrive-clock-t">—:—</span></div>
    </div>

    <div class="sheet" id="sheet-flight" style="display:none;">
      <div class="sheet-handle"></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill-f"></div></div>
      <div class="progress-caption">
        <span>進捗率</span>
        <span class="num" id="progress-pct-f">0%</span>
      </div>
      <div class="station-row">
        <div class="station-col">
          <span class="station-tag">現在位置</span>
          <span class="station-name" id="cur-position">—</span>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-box"><div class="v num" id="flight-total">—</div><div class="l">飛行時間</div></div>
        <div class="stat-box"><div class="v num" id="flight-remain">—</div><div class="l">残り時間</div></div>
      </div>
      <div class="eta-line">到着予定 <span class="num" id="arrive-clock-f">—:—</span></div>
    </div>
  </div>

  <!-- ============ ARRIVAL ============ -->
  <div id="screen-arrival" class="screen">
    <div class="arrival-emoji">🎉</div>
    <div class="arrival-title">到着しました！</div>
    <div class="arrival-station" id="arrival-station-text">大阪駅に到着</div>
    <div class="arrival-sub">お疲れ様でした。</div>
    <button class="arrival-home-btn" id="arrival-home-btn">ホームに戻る</button>
  </div>

</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
<script>
(function(){
  "use strict";

  /* =====================================================
     ROUTE DATA
     To add a new route: push an object into ROUTES[mode]
     with { id, from, to, line, type, durationMin, points }
     points = ordered list of {name, lat, lng, t, stop} where t is
     the cumulative minute offset from departure (last point's t must
     equal durationMin) and stop marks a real stopping station (false
     for shape-only vertices added purely to trace the real track curve
     between stops — name is null for those). For flights, point names
     for mid-route waypoints should read as a passing landmark, e.g.
     "仙台上空".
  ===================================================== */
  const ROUTES = {
    train: [
      {
        // Times below follow the real track shape (17 real stations + one
        // curve vertex through the Tenno-zan gap), interpolated by actual
        // distance travelled between this service's real stops — not a
        // straight line — so the marker tracks the true rail alignment.
        id:'kyoto-osaka-shinkaisoku', from:'京都', to:'大阪',
        line:'JR京都線', type:'新快速', durationMin:29,
        points:[
          {name:'京都',     lat:34.9858, lng:135.7588, t:0,    stop:true},
          {name:'西大路',   lat:34.9835, lng:135.7325, t:1.8,  stop:false},
          {name:'桂川',     lat:34.9614, lng:135.7139, t:3.9,  stop:false},
          {name:'向日町',   lat:34.9436, lng:135.6994, t:5.7,  stop:false},
          {name:'長岡京',   lat:34.9269, lng:135.6889, t:7.2,  stop:false},
          {name:null,      lat:34.9100, lng:135.6750, t:8.9,  stop:false},
          {name:'山崎',     lat:34.8961, lng:135.6597, t:10.4, stop:false},
          {name:'島本',     lat:34.8814, lng:135.6444, t:12.0, stop:false},
          {name:'高槻',     lat:34.8506, lng:135.6183, t:15,   stop:true},
          {name:'摂津富田', lat:34.8394, lng:135.6019, t:15.9, stop:false},
          {name:'JR総持寺', lat:34.8264, lng:135.5794, t:17.2, stop:false},
          {name:'茨木',     lat:34.8164, lng:135.5686, t:17.9, stop:false},
          {name:'千里丘',   lat:34.7847, lng:135.5389, t:20.0, stop:false},
          {name:'岸辺',     lat:34.7683, lng:135.5169, t:21.4, stop:false},
          {name:'吹田',     lat:34.7597, lng:135.5153, t:21.8, stop:false},
          {name:'東淀川',   lat:34.7286, lng:135.5089, t:23.5, stop:false},
          {name:'新大阪',   lat:34.7338, lng:135.5001, t:24,   stop:true},
          {name:'大阪',     lat:34.7024, lng:135.4959, t:29,   stop:true}
        ]
      },
      {
        id:'kyoto-osaka-kaisoku', from:'京都', to:'大阪',
        line:'JR京都線', type:'快速', durationMin:40,
        points:[
          {name:'京都',     lat:34.9858, lng:135.7588, t:0,    stop:true},
          {name:'西大路',   lat:34.9835, lng:135.7325, t:1.9,  stop:false},
          {name:'桂川',     lat:34.9614, lng:135.7139, t:4.2,  stop:false},
          {name:'向日町',   lat:34.9436, lng:135.6994, t:6.0,  stop:false},
          {name:'長岡京',   lat:34.9269, lng:135.6889, t:7.6,  stop:false},
          {name:null,      lat:34.9100, lng:135.6750, t:9.4,  stop:false},
          {name:'山崎',     lat:34.8961, lng:135.6597, t:11,   stop:true},

  const LAT0 = 37;
  const GEO_SCALE = 1000;
  const COS_LAT0 = Math.cos(LAT0 * Math.PI / 180);
  const KM_PER_DEG = 111.32;
  const UNITS_PER_KM = GEO_SCALE / KM_PER_DEG;
  function project(lng, lat){
    return { x: lng * COS_LAT0 * GEO_SCALE, y: -lat * GEO_SCALE };
  }
  function segmentKm(a,b){
    const dLat = (b.lat-a.lat) * KM_PER_DEG;
    const dLng = (b.lng-a.lng) * KM_PER_DEG * Math.cos((a.lat+b.lat)/2 * Math.PI/180);
    return Math.hypot(dLat, dLng);
  }
  // Average spacing between real *stops* (shape-only curve vertices don't count),
  // used to size the tracking camera window.
  function avgSegmentKm(route){
    const stops = route.points.filter(p=>p.stop);
    let total = 0;
    for(let i=0;i<stops.length-1;i++) total += segmentKm(stops[i], stops[i+1]);
    return total / Math.max(1, stops.length-1);
  }
  function pickTileZoom(avgKm){
    if(avgKm < 2) return 16;
    if(avgKm < 5) return 15;
    if(avgKm < 12) return 14;
    if(avgKm < 30) return 12;
    if(avgKm < 80) return 10;
    return 8;
  }
  function prevStop(points, idx){
    for(let i=idx;i>=0;i--){ if(points[i].stop) return points[i]; }
    return points[0];
  }
  function nextStop(points, idx){
    for(let i=idx+1;i<points.length;i++){ if(points[i].stop) return points[i]; }
    return points[points.length-1];
  }
  function remainingStopsCount(points, idx){
    let c = 0;
    for(let i=idx+1;i<points.length;i++){ if(points[i].stop) c++; }
    return c;
  }
  function headingDeg(fromPt, toPt){
    const a = project(fromPt.lng, fromPt.lat), b = project(toPt.lng, toPt.lat);
    const dx = b.x-a.x, dy = b.y-a.y;
    if(Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) return 0;
    return Math.atan2(dy,dx) * 180/Math.PI;
  }
  // True compass bearing (0=N, 90=E, clockwise) between two lat/lng points —
  // matches MapLibre's `bearing` convention, used to rotate the real map so
  // it always faces the direction of travel, like turn-by-turn navigation.
  function compassBearing(fromPt, toPt){
    const lat1 = fromPt.lat*Math.PI/180, lat2 = toPt.lat*Math.PI/180;
    const dLon = (toPt.lng-fromPt.lng)*Math.PI/180;
    const y = Math.sin(dLon)*Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    if(Math.abs(y) < 1e-9 && Math.abs(x) < 1e-9) return 0;
    return (Math.atan2(y,x)*180/Math.PI + 360) % 360;

  // so the hand-plotted coastline reads as a natural curve rather than a low-poly outline.
  function smoothRingPathD(ring){

    const n = pts.length;
    if(n < 3) return ringPathD(ring);
    let d = 'M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1)+' ';
    for(let i=0;i<n;i++){
      const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
      const c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;

  const sheetTrain = document.getElementById('sheet-train');
  const sheetFlight = document.getElementById('sheet-flight');
  const mapSvg = document.getElementById('map-svg');
  const fullLineEl = document.getElementById('route-full-line');
  const traveledLineEl = document.getElementById('route-traveled-line');
  const stationDotsEl = document.getElementById('station-dots');
  const vehicleMarker = document.getElementById('vehicle-marker');
  const vehicleContent = document.getElementById('vehicle-content');
  let vehicleIconScale = 1;
  let trackVbW = 0, trackVbH = 0;

  function tileTrainIconHtml(color){
    return '<div class="tile-vehicle-rot" style="width:34px;height:34px;">' +
      '<svg width="34" height="34" viewBox="-17 -17 34 34" style="filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));">' +
      '<rect x="-12" y="-6.5" width="20" height="13" rx="6.2" fill="'+color+'" stroke="#fff" stroke-width="1.6"/>' +
      '<path d="M7.5,-6.5 C13,-6.5 17,-2.5 17.5,0 C17,2.5 13,6.5 7.5,6.5 Z" fill="'+color+'" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<rect x="-9" y="-3.2" width="4.2" height="4.4" rx="1.1" fill="#eaf2ff"/>' +
      '<rect x="-3" y="-3.2" width="4.2" height="4.4" rx="1.1" fill="#eaf2ff"/>' +
      '<rect x="3" y="-3.2" width="4.2" height="4.4" rx="1.1" fill="#eaf2ff"/>' +
      '</svg></div>';
  }

  // Adds/updates the route-line sources+layers and the vehicle marker on the
  // MapLibre map. Safe to call again for a new session once the map exists.
  function setupTileRoute(route, mode, color){
    const lineCoords = route.points.map(p=>[p.lng, p.lat]);
    const fullGeo = {type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:lineCoords}};
    const traveledGeo = {type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:[lineCoords[0], lineCoords[0]]}};

    if(tileMap.getSource('tile-route-full')){
      tileMap.getSource('tile-route-full').setData(fullGeo);
      tileMap.getSource('tile-route-traveled').setData(traveledGeo);
    } else {
      tileMap.addSource('tile-route-full', {type:'geojson', data:fullGeo});
      tileMap.addSource('tile-route-traveled', {type:'geojson', data:traveledGeo});
      tileMap.addLayer({
        id:'tile-route-full-line', type:'line', source:'tile-route-full',
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#ffffff','line-width':7,'line-opacity':0.9}
      });
      tileMap.addLayer({
        id:'tile-route-traveled-line', type:'line', source:'tile-route-traveled',
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':color,'line-width':4,'line-opacity':0.95}
      });
    }

    if(tileVehicleMarker) tileVehicleMarker.remove();
    const wrap = document.createElement('div');
    wrap.innerHTML = mode === 'flight'
      ? '<div style="font-size:22px; filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));">'+MODE_ICON[mode]+'</div>'
      : tileTrainIconHtml(color);
    // The map's own bearing is set to the direction of travel each tick (see
    // tick()), so the marker just needs to point "up" in screen space — hence
    // rotationAlignment:'viewport' with a fixed -90° offset to turn the icon
    // (drawn pointing right) into one pointing up.
    tileVehicleMarker = new maplibregl.Marker({element:wrap.firstElementChild, rotationAlignment:'viewport'})
      .setLngLat(lineCoords[0])
      .setRotation(mode === 'flight' ? 0 : -90)
      .addTo(tileMap);
  }

  // Attempts to show a real, detailed map — self-hosted PMTiles (OpenStreetMap
  // data) rendered with MapLibre GL — with a tracking camera that follows and
  // rotates with the vehicle, like a navigation app. This only works once
  // map-data/japan.pmtiles + map-data/japan-style.json exist in this repo
  // (download from a PMTiles provider and place them there — see map-data/README).
  // If they aren't found within a short window, the hand-drawn SVG map (already
  // showing, and already tracking) is simply left in place — no error.
  function tryLoadTiles(route, mode, color){
    if(typeof maplibregl === 'undefined' || typeof pmtiles === 'undefined') return;
    if(tileLayerAdded && !tileModeActive) return; // already tried once & unavailable

    tileAttemptToken++;
    const myToken = tileAttemptToken;
    const tileMapEl = document.getElementById('tile-map');
    const zoom = pickTileZoom(avgSegmentKm(route));
    const bearing = mode === 'flight' ? 0 : compassBearing(route.points[0], nextStop(route.points, 0));
    const startLngLat = [route.points[0].lng, route.points[0].lat];

    if(!pmtilesProtocolReady){
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);
      pmtilesProtocolReady = true;
    }

    if(!tileMap){
      tileLayerAdded = true;
      let gotLoad = false;
      try{
        tileMap = new maplibregl.Map({
          container: tileMapEl,
          style: PMTILES_STYLE_URL,
          center: startLngLat,
          zoom: zoom,
          bearing: bearing,
          attributionControl: {compact:true}
        });
      } catch(e){ tileModeActive = false; return; }
      tileMap.on('error', ()=>{ /* swallow — resolved by the timeout below */ });
      tileMap.on('load', ()=>{
        gotLoad = true;
        tileModeActive = true;
        setupTileRoute(route, mode, color);
        tileMapEl.classList.add('tile-live');
        mapSvg.classList.add('svg-retired');
        setTimeout(()=>{ if(tileMap) tileMap.resize(); }, 30);
      });
      setTimeout(()=>{
        if(myToken !== tileAttemptToken) return;
        if(!gotLoad) tileModeActive = false; // stays on the SVG fallback
      }, 3000);
    } else if(tileModeActive){
      tileMap.jumpTo({center:startLngLat, zoom:zoom, bearing:bearing});
      setupTileRoute(route, mode, color);
      tileMapEl.classList.add('tile-live');
      mapSvg.classList.add('svg-retired');
      setTimeout(()=>{ if(tileMap) tileMap.resize(); }, 30);
    }
  }

  function startSession(route, mode){
    const color = MODE_COLOR[mode];
    document.documentElement.style.setProperty('--accent', color);

    routePill.querySelector('.dot').style.background = color;
    routePillText.textContent = route.from + ' → ' + route.to;
    routePillBadge.textContent = route.type;
    routePillBadge.style.background = color;

    sheetTrain.style.display = (mode === 'flight') ? 'none' : 'block';
    sheetFlight.style.display = (mode === 'flight') ? 'block' : 'none';

    session = {
      route, mode, start: Date.now(),
      totalMs: route.durationMin * 60000,
      color
    };

    showScreen('screen-focus');

    setTimeout(()=>{
      // --- tracking camera window: sized from this route's average stop spacing,
      //     so express trains get a wider view and local trains a tighter one ---
      const avgKm = avgSegmentKm(route);
      const halfWidthKm = Math.min(200, Math.max(1, avgKm * 1.5));
      const rect = mapSvg.getBoundingClientRect();
      const aspect = Math.max(0.4, rect.width / Math.max(1, rect.height));
      trackVbW = halfWidthKm * 2 * UNITS_PER_KM;
      trackVbH = trackVbW / aspect;
      mapScale = trackVbW / Math.max(1, rect.width);

      fullLineEl.setAttribute('d', lineD(route.points));
      fullLineEl.setAttribute('stroke-width', (4*mapScale).toFixed(2));
      traveledLineEl.setAttribute('stroke', color);
      traveledLineEl.setAttribute('stroke-width', (5.5*mapScale).toFixed(2));
      const startPr = project(route.points[0].lng, route.points[0].lat);
      traveledLineEl.setAttribute('d', 'M'+startPr.x.toFixed(1)+','+startPr.y.toFixed(1));

      landLayer.setAttribute('stroke-width', (1.3*mapScale).toFixed(2));
      rescaleCities(mapScale);

      stationDotsEl.innerHTML = '';
      if(mode !== 'flight'){
        route.points.filter(p=>p.stop).forEach(p=>{
          const pr = project(p.lng, p.lat);
          const c = document.createElementNS(SVGNS,'circle');
          c.setAttribute('cx', pr.x.toFixed(1));
          c.setAttribute('cy', pr.y.toFixed(1));
          c.setAttribute('r', (3.2*mapScale).toFixed(2));
          c.setAttribute('fill', '#ffffff');
          c.setAttribute('stroke', color);
          c.setAttribute('stroke-width', (1.6*mapScale).toFixed(2));
          stationDotsEl.appendChild(c);
        });
      }

      // --- vehicle icon: a realistic rotating train for train/shinkansen, the
      //     plane emoji (unrotated) for flights ---
      while(vehicleContent.firstChild) vehicleContent.removeChild(vehicleContent.firstChild);
      if(mode === 'flight'){
        const halo = document.createElementNS(SVGNS,'circle');
        halo.setAttribute('r', (15*mapScale).toFixed(2));
        halo.setAttribute('fill', '#ffffff');
        const txt = document.createElementNS(SVGNS,'text');
        txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','central');
        txt.setAttribute('font-size', (18*mapScale).toFixed(2));
        txt.setAttribute('y', (0.5*mapScale).toFixed(2));
        txt.textContent = MODE_ICON[mode];
        vehicleContent.appendChild(halo); vehicleContent.appendChild(txt);
        vehicleIconScale = mapScale;
      } else {
        vehicleContent.appendChild(buildTrainIcon(color));
        vehicleIconScale = mapScale * 1.15;
      }
      vehicleMarker.setAttribute('transform', 'translate('+startPr.x.toFixed(1)+','+startPr.y.toFixed(1)+')');

      mapSvg.setAttribute('viewBox', (startPr.x-trackVbW/2)+' '+(startPr.y-trackVbH/2)+' '+trackVbW+' '+trackVbH);

      tryLoadTiles(route, mode, color);
    }, 60);

    if(tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(tick, 500);
    tick();
  }

  function tick(){
    if(!session) return;
    const elapsedMs = Date.now() - session.start;
    const elapsedMin = elapsedMs / 60000;
    const route = session.route;

    if(elapsedMin >= route.durationMin){
      finishSession();
      return;
    }

    const loc = locate(route.points, elapsedMin);
    const p0 = route.points[loc.idx], p1 = route.points[loc.idx+1] || p0;
    const lat = lerp(p0.lat, p1.lat, loc.frac);
    const lng = lerp(p0.lng, p1.lng, loc.frac);
    const pr = project(lng, lat);
    const heading = headingDeg(p0, p1);

    if(session.mode === 'flight'){
      vehicleMarker.setAttribute('transform', 'translate('+pr.x.toFixed(1)+','+pr.y.toFixed(1)+')');
    } else {
      vehicleMarker.setAttribute('transform',
        'translate('+pr.x.toFixed(1)+','+pr.y.toFixed(1)+') rotate('+heading.toFixed(1)+') scale('+vehicleIconScale.toFixed(3)+')');
    }

    // tracking camera: recenter the visible window on the current position
    mapSvg.setAttribute('viewBox', (pr.x-trackVbW/2)+' '+(pr.y-trackVbH/2)+' '+trackVbW+' '+trackVbH);

    let d = lineD(route.points.slice(0, loc.idx+1));
    d += ' L'+pr.x.toFixed(1)+','+pr.y.toFixed(1);
    traveledLineEl.setAttribute('d', d);

    if(tileModeActive && tileVehicleMarker){
      tileVehicleMarker.setLngLat([lng,lat]);
      const traveled = route.points.slice(0, loc.idx+1).map(p=>[p.lng,p.lat]);
      traveled.push([lng,lat]);
      const src = tileMap.getSource('tile-route-traveled');
      if(src) src.setData({type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:traveled}});

      const easeOpts = {center:[lng,lat], duration:450, easing:t=>t};
      if(session.mode !== 'flight') easeOpts.bearing = compassBearing(p0, p1);
      tileMap.easeTo(easeOpts);
    }

    const progressPct = Math.min(100, Math.round((elapsedMin/route.durationMin)*100));
    const remainMin = Math.max(0, Math.ceil(route.durationMin - elapsedMin));
    const arrivalClock = formatClock(new Date(session.start + session.totalMs));

    if(session.mode === 'flight'){
      const nextEtaMin = Math.max(0, Math.ceil(p1.t - elapsedMin));
      document.getElementById('progress-fill-f').style.width = progressPct+'%';
      document.getElementById('progress-pct-f').textContent = progressPct+'%';
      document.getElementById('cur-position').textContent = (loc.frac >= 1 ? p1.name : p0.name);
      document.getElementById('flight-total').textContent = formatDuration(route.durationMin);
      document.getElementById('flight-remain').textContent = formatDuration(remainMin);
      document.getElementById('arrive-clock-f').textContent = arrivalClock;
    } else {
      const curSt = prevStop(route.points, loc.idx);
      const nxtSt = nextStop(route.points, loc.idx);
      const nextEtaMin = Math.max(0, Math.ceil(nxtSt.t - elapsedMin));
      const remainStations = remainingStopsCount(route.points, loc.idx);
      document.getElementById('progress-fill-t').style.width = progressPct+'%';
      document.getElementById('progress-pct-t').textContent = progressPct+'%';
      document.getElementById('cur-station').textContent = curSt.name;
      document.getElementById('next-station').textContent = nxtSt.name;
      document.getElementById('remain-count').textContent = remainStations+'駅';
      document.getElementById('next-eta').textContent = nextEtaMin+'分';
      document.getElementById('arrive-eta').textContent = remainMin+'分';
      document.getElementById('arrive-clock-t').textContent = arrivalClock;
    }
  }

  function finishSession(){
    if(tickTimer) clearInterval(tickTimer);
    tickTimer = null;
    const route = session.route;
    const mode = session.mode;
    const suffix = mode === 'flight' ? 'に到着' : '駅に到着';
    document.getElementById('arrival-station-text').textContent = route.to + suffix;
    session = null;
    showScreen('screen-arrival');
  }

  document.getElementById('focus-back').addEventListener('click', ()=>{
    if(tickTimer) clearInterval(tickTimer);
    tickTimer = null;
    session = null;
    showScreen('screen-home');
  });
  document.getElementById('arrival-home-btn').addEventListener('click', ()=>{
    showScreen('screen-home');
  });

})();
</script>
</body>
</html>
